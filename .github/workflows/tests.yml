name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-python:
    name: C++ and Python (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Make on Linux and macOS: cpp-zarr builds libuuid there with an
        # ExternalProject that calls make, which breaks under Ninja. Windows has no
        # libuuid step.
        include:
          - { name: Linux,   os: ubuntu-24.04, shell: bash,        generator: Unix Makefiles }
          - { name: macOS,   os: macos-15,     shell: bash,        generator: Unix Makefiles }
          - { name: Windows, os: windows-2025, shell: 'msys2 {0}', generator: Ninja }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      # The build flags and OpenMP setup are GCC-only, so Windows uses MinGW.
      # MSYS2 packages GCC's OpenMP runtime (libgomp) separately from gcc. git is
      # for CMake's FetchContent, which clones cpp-tiff, cpp-zarr and ImarisWriter
      # (the MSYS2 shell does not see the runner's own git).
      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: git
          pacboy: gcc:p libgomp:p cmake:p ninja:p

      # Same compiler as the release builds. Apple clang has no OpenMP.
      - name: Set up GCC 13 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc@13 > /dev/null 2>&1 || brew install gcc@13
          echo "CC=$(brew --prefix gcc@13)/bin/gcc-13" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc@13)/bin/g++-13" >> "$GITHUB_ENV"

      # The release target assembles the shipped folder (executable, libcppTiff,
      # libcppZarr and, on Linux and macOS, libgomp) that the tests run from.
      - name: Build
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DPIW_BUILD_TESTS=ON
          cmake --build build --parallel 4
          cmake --build build --target release

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
